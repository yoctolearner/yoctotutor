# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mallikharjun"
BBFILE_PATTERN_meta-mallikharjun = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mallikharjun = "6"

LAYERDEPENDS_meta-mallikharjun = "core"
LAYERSERIES_COMPAT_meta-mallikharjun = "scarthgap"
